name: Build & Release Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (semver)'
        required: true
        type: string

permissions:
  contents: write


jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        run: |
          TAG="${{ inputs.tag }}"
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"
            exit 1
          fi

          VERSION_NAME="${TAG#v}"                    # v1.2.3 -> 1.2.3
          NUMERIC="${VERSION_NAME%%-*}"               # 1.2.3-beta.1 -> 1.2.3
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NUMERIC"

          VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          echo "TAG=$TAG"                    >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME"  >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE"  >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bump version in build file
        run: |
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode = $VERSION_CODE/"        app/build.gradle.kts
          sed -i -E "s/versionName[ =]+\"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts

      - name: Commit and push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): bump version to $VERSION_NAME"
          git push origin "HEAD:$(git branch --show-current)"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        id: sign-apk
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload build outputs as artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: app/build/outputs/apk/release/*.apk

      - name: Create git tag
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ steps.sign-apk.outputs.signedReleaseFile }}
